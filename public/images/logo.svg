<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shape -->
  <rect width="100" height="100" rx="22" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  
  <!-- Sleek Modern Monogram F and D -->
  <g filter="url(#glow)">
    <!-- Letter F structure -->
    <path d="M30 30 H62 V40 H42 V50 H58 V60 H42 V70 H30 Z" fill="url(#grad)" opacity="0.9" />
    <!-- Letter D structure overlapping -->
    <path d="M48 30 H64 C74.5 30 83 38.5 83 49 C83 59.5 74.5 68 64 68 H48 V58 H64 C69 58 71 54 71 49 C71 44 69 40 64 40 H48 Z" fill="url(#grad)" />
  </g>
</svg>
